[project]
name = "ibu-tracker"
version = "0.1.0"
description = "Telegram bot to track insulin, glucose, and blood pressure"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-telegram-bot[job-queue]>=22.0,<23.0",
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
